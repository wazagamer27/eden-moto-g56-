name: Compilar Eden PowerVR Definitivo
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Configurar Java 11 (Compatible)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Instalar Herramientas de Android
      uses: android-actions/setup-android@v3

    - name: Corregir Permisos y Compilar Manualmente
      run: |
        cd src/android
        chmod +x gradlew
        ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Guardar y Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: Eden-MotoG56-Fix
        path: |
          src/android/app/build/outputs/apk/release/*.apk
          src/android/App/build/outputs/apk/release/*.apk
